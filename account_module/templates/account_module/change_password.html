{% extends "base.html" %}
{% block content %}
<div class="container page narrow">
  <h1>Change password</h1>
  <form method="post" class="card-box form-stack" novalidate>
    {% csrf_token %}
    {% if form.non_field_errors %}<div class="msg msg-error">{{ form.non_field_errors }}</div>{% endif %}
    {% for field in form %}{% include "shared/_field.html" %}{% endfor %}
    <button class="btn btn-lg" type="submit">Update password</button>
  </form>
</div>
{% endblock %}
